@version: 4.8
@include "scl.conf"

options {
  keep-hostname(yes);
  chain-hostnames(no);
  use-dns(no);
  stats(freq(0));
};

source s_lab_udp {
  udp(ip("0.0.0.0") port(5514));
};

destination d_wazuh_manager {
  udp("wazuh.manager" port(514));
};

log {
  source(s_lab_udp);
  destination(d_wazuh_manager);
};
